<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Tiro Parabólico</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

        :root {
            --primary: #ff4c4c;
            --primary-hover: #e03e3e;
            --bg-color: #f0f4f8;
            --text-main: #2d3748;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.4);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-main);
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin-top: 30px;
            margin-bottom: 30px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            color: white;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.3);
        }

        h1 {
            margin: 0;
            font-weight: 800;
            font-size: 2.5rem;
            letter-spacing: 1px;
        }

        p.subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .panel {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            justify-content: center;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .input-group label {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: #4a5568;
        }

        .input-group input {
            padding: 10px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            width: 120px;
            font-family: 'Poppins', sans-serif;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .input-group input:focus {
            border-color: #9face6;
            box-shadow: 0 0 0 3px rgba(159, 172, 230, 0.3);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-launch {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 76, 76, 0.4);
        }

        .btn-launch:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 76, 76, 0.6);
        }

        .btn-launch:active {
            transform: translateY(0);
        }

        .btn-clear {
            background-color: #6c757d;
            color: white;
            box-shadow: 0 4px 15px rgba(108, 117, 125, 0.4);
        }

        .btn-clear:hover {
            background-color: #5a6268;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(108, 117, 125, 0.6);
        }

        .results {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            color: #2b6cb0;
        }

        .results span {
            margin: 0 10px;
            display: inline-block;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            height: 500px;
            border-radius: 16px;
            overflow: hidden;
            background: #87CEEB; /* Sky blue */
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 4px solid white;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 { font-size: 1.8rem; }
            .canvas-container { height: 350px; }
            .controls { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🚀 Tiro Parabólico</h1>
            <p class="subtitle">Simulador de Física Estilo Angry Birds</p>
        </header>

        <div class="panel controls">
            <div class="input-group">
                <label for="v0">Velocidad Inicial (m/s)</label>
                <input type="number" id="v0" value="25" step="1" min="1">
            </div>
            <div class="input-group">
                <label for="angle">Ángulo (grados)</label>
                <input type="number" id="angle" value="45" step="1" min="1" max="89">
            </div>
            <button class="btn btn-launch" onclick="launch()">🚀 LANZAR PROYECTIL</button>
            <button class="btn btn-clear" onclick="clearSim()">🧹 LIMPIAR</button>
        </div>

        <div class="panel">
            <div class="results" id="results">
                Ingresa los valores arriba y presiona Lanzar para ver la simulación.
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="simCanvas"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const resultsDiv = document.getElementById('results');

        let animationId = null;
        let bird = { radius: 12 };
        let simulationData = null;

        // Resize canvas to match container size to avoid blurriness
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            drawStatic();
        }
        window.addEventListener('resize', resizeCanvas);

        function clearSim() {
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            document.getElementById('v0').value = '25';
            document.getElementById('angle').value = '45';
            resultsDiv.innerHTML = "Ingresa los valores arriba y presiona Lanzar para ver la simulación.";
            simulationData = null;
            drawStatic();
        }

        function launch() {
            if (animationId) {
                cancelAnimationFrame(animationId);
            }

            const v0 = parseFloat(document.getElementById('v0').value);
            const angleDeg = parseFloat(document.getElementById('angle').value);

            if (isNaN(v0) || isNaN(angleDeg)) {
                alert("Por favor ingresa únicamente valores numéricos.");
                return;
            }

            const g = 9.81;
            const angleRad = angleDeg * (Math.PI / 180);
            const v0x = v0 * Math.cos(angleRad);
            const v0y = v0 * Math.sin(angleRad);

            const tTotal = (2 * v0y) / g;

            if (tTotal <= 0) {
                alert("El ángulo es demasiado bajo o negativo, el proyectil no logrará elevarse.");
                return;
            }

            const hMax = (Math.pow(v0y, 2)) / (2 * g);
            const xMax = v0x * tTotal;

            resultsDiv.innerHTML = `
                <span><strong>Altura Máxima:</strong> ${hMax.toFixed(2)} m</span> | 
                <span><strong>Alcance:</strong> ${xMax.toFixed(2)} m</span> | 
                <span><strong>Tiempo de Vuelo:</strong> ${tTotal.toFixed(2)} s</span>
            `;

            // Setup simulation data for rendering
            simulationData = {
                startTime: performance.now(),
                v0x, v0y, g, tTotal, hMax, xMax,
                scaleX: (canvas.width - 60) / xMax, // Leave 60px margin
                scaleY: (canvas.height - 80) / (Math.max(hMax, 5)), // Leave 80px top margin
                groundY: canvas.height - 40 // Ground level
            };
            
            // Pre-calculate expected trajectory points for drawing the dashed line
            const numPoints = 60;
            simulationData.path = [];
            for(let i=0; i<=numPoints; i++){
                let t = (i/numPoints) * tTotal;
                let px = v0x * t;
                let py = v0y * t - 0.5 * g * t * t;
                simulationData.path.push({x: px, y: py});
            }

            requestAnimationFrame(animate);
        }

        function drawGround() {
            // Background Sky
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Ground
            ctx.fillStyle = '#654321';
            ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
            
            // Grass
            ctx.fillStyle = '#4CAF50';
            ctx.fillRect(0, canvas.height - 40, canvas.width, 10);
        }

        function toCanvasCoords(physX, physY) {
            if(!simulationData) return {cx:0, cy:0};
            return {
                cx: physX * simulationData.scaleX + 30, // 30px left padding
                cy: simulationData.groundY - (physY * simulationData.scaleY)
            };
        }

        function drawStatic() {
            drawGround();
            if(!simulationData) {
                ctx.fillStyle = "rgba(255,255,255,0.8)";
                ctx.font = "bold 24px Poppins";
                ctx.textAlign = "center";
                ctx.fillText("Esperando lanzamiento...", canvas.width/2, canvas.height/2);
            }
        }

        function drawBird(cx, cy) {
            // Bird body (Red circle)
            ctx.beginPath();
            ctx.arc(cx, cy, bird.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#da2c38'; // Angry red
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#2b2b2b';
            ctx.stroke();

            // Belly
            ctx.beginPath();
            ctx.arc(cx, cy + 4, bird.radius - 4, 0, Math.PI);
            ctx.fillStyle = '#f3e5ab';
            ctx.fill();

            // Eye
            ctx.beginPath();
            ctx.arc(cx + 4, cy - 3, 3.5, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.stroke();

            // Pupil
            ctx.beginPath();
            ctx.arc(cx + 5.5, cy - 3, 1.5, 0, Math.PI * 2);
            ctx.fillStyle = 'black';
            ctx.fill();

            // Angry eyebrow
            ctx.beginPath();
            ctx.moveTo(cx + 1, cy - 6);
            ctx.lineTo(cx + 7, cy - 4);
            ctx.lineWidth = 2.5;
            ctx.stroke();

            // Beak
            ctx.beginPath();
            ctx.moveTo(cx + 9, cy);
            ctx.lineTo(cx + 16, cy + 3);
            ctx.lineTo(cx + 8, cy + 5);
            ctx.fillStyle = '#FFD700';
            ctx.fill();
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        function animate(currentTime) {
            if (!simulationData) return;

            // Use elapsed time to determine position
            const t = (currentTime - simulationData.startTime) / 1000; 
            const simTime = t * 1.5; // Speed multiplier (1.5x real time for better UX)

            drawGround();

            // Draw dashed trajectory line
            ctx.beginPath();
            ctx.setLineDash([6, 6]);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.lineWidth = 2;
            let start = toCanvasCoords(simulationData.path[0].x, simulationData.path[0].y);
            ctx.moveTo(start.cx, start.cy);
            for(let pt of simulationData.path) {
                let coords = toCanvasCoords(pt.x, pt.y);
                ctx.lineTo(coords.cx, coords.cy);
            }
            ctx.stroke();
            ctx.setLineDash([]); // Reset line dash

            // Draw HUD Info Box
            function drawHUD(time, dist, alt) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                ctx.beginPath();
                ctx.roundRect(15, 15, 160, 80, 8);
                ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.1)';
                ctx.stroke();
                
                ctx.fillStyle = '#2d3748';
                ctx.font = "bold 13px Poppins";
                ctx.textAlign = "left";
                ctx.fillText(`⏱️ Tiempo: ${time.toFixed(2)} s`, 25, 38);
                ctx.fillText(`📍 Dist: ${dist.toFixed(1)} m`, 25, 58);
                ctx.fillText(`🚀 Altura: ${alt.toFixed(1)} m`, 25, 78);
            }

            if (simTime < simulationData.tTotal) {
                // Calculate current physical position
                const currentX = simulationData.v0x * simTime;
                const currentY = simulationData.v0y * simTime - 0.5 * simulationData.g * simTime * simTime;
                
                const coords = toCanvasCoords(currentX, currentY);
                drawBird(coords.cx, coords.cy);
                drawHUD(simTime, currentX, currentY);

                animationId = requestAnimationFrame(animate);
            } else {
                // Animation ended, force to final position to be precise
                const coords = toCanvasCoords(simulationData.xMax, 0);
                drawBird(coords.cx, coords.cy);
                drawHUD(simulationData.tTotal, simulationData.xMax, 0);
                
                animationId = null;
            }
        }

        // Initialize canvas on load
        window.onload = resizeCanvas;
    </script>
</body>
</html>
